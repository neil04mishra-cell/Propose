<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mistuuu 💍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ffd6e7,#f6e6ff,#fff0f5);
  font-family:'Poppins',sans-serif;
  overflow:hidden;
}

/* floating hearts */
.heart{
 position:absolute;
 width:15px;
 height:15px;
 background:#ff7aa2;
 transform:rotate(45deg);
 animation:float 6s infinite;
 opacity:.6;
}
.heart:before,.heart:after{
 content:"";
 position:absolute;
 width:15px;
 height:15px;
 background:#ff7aa2;
 border-radius:50%;
}
.heart:before{top:-8px;}
.heart:after{left:-8px;}

@keyframes float{
 from{transform:translateY(100vh) rotate(45deg);}
 to{transform:translateY(-10vh) rotate(45deg);}
}

/* main card */
.container{
 background:rgba(255,255,255,0.75);
 backdrop-filter:blur(12px);
 border-radius:25px;
 padding:40px;
 text-align:center;
 box-shadow:0 15px 40px rgba(0,0,0,.1);
 max-width:550px;
 width:90%;
}

/* heading */
h1{
 font-family:'Great Vibes',cursive;
 color:#d63384;
 font-size:42px;
 margin-bottom:15px;
}

/* proposal image */
.proposal-img{
 width:100%;
 max-width:340px;
 border-radius:20px;
 box-shadow:0 10px 30px rgba(0,0,0,0.15);
 animation:breathe 3s infinite;
}

@keyframes breathe{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-6px)}
}

/* text */
.question{
 font-size:20px;
 color:#7b2cbf;
 margin:20px 0;
 font-weight:500;
}

/* buttons */
button{
 padding:12px 28px;
 border:none;
 border-radius:40px;
 font-size:16px;
 cursor:pointer;
 margin:10px;
 transition:.3s;
}

#yes{
 background:#ff4da6;
 color:white;
 box-shadow:0 8px 20px rgba(255,77,166,.4);
}

#no{
 background:#999;
 color:white;
 position:absolute;
}

/* love message */
#message{
 display:none;
 margin-top:20px;
 font-size:18px;
 color:#8a2be2;
 animation:fade 1s ease;
}

@keyframes fade{
 from{opacity:0; transform:scale(.8)}
 to{opacity:1; transform:scale(1)}
}

/* confetti */
canvas{
 position:fixed;
 top:0;
 left:0;
 pointer-events:none;
}

</style>
</head>

<body>

<!-- floating hearts script -->
<script>
for(let i=0;i<25;i++){
 let h=document.createElement("div");
 h.className="heart";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(Math.random()*4+4)+"s";
 document.body.appendChild(h);
}
</script>

<div class="container">

<h1>Mistuuu 💖</h1>

<!-- YOUR IMAGE HERE -->
<img src="proposal.png" class="proposal-img">

<div class="question">
Will you walk through life with me and be my Valentine forever?
</div>

<button id="yes">Yes ❤️</button>
<button id="no">No</button>

<div id="message">
You are my happiness, my peace, my forever Mistuuu.  
I love you more than words can ever explain 💍
</div>

</div>

<canvas id="confetti"></canvas>

<script>

/* runaway NO button */
let no=document.getElementById("no");
no.onmouseover=no.onclick=function(){
 no.style.left=Math.random()*250+"px";
 no.style.top=Math.random()*120+"px";
}

/* YES click */
let yes=document.getElementById("yes");
yes.onclick=function(){
 document.getElementById("message").style.display="block";
 startConfetti();
}

/* confetti animation */
let canvas=document.getElementById("confetti");
let ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let pieces=[];
function startConfetti(){
 for(let i=0;i<200;i++){
  pieces.push({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height,
   s:Math.random()*8+4,
   dy:Math.random()*3+2,
   dx:Math.random()*2-1,
   c:`hsl(${Math.random()*360},100%,70%)`
  });
 }
 animate();
}

function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 pieces.forEach(p=>{
  ctx.fillStyle=p.c;
  ctx.fillRect(p.x,p.y,p.s,p.s);
  p.y+=p.dy;
  p.x+=p.dx;
 });
 requestAnimationFrame(animate);
}

</script>

</body>
</html>
