<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mistuuu 💍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body{
 margin:0;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 font-family:'Poppins',sans-serif;
 background: linear-gradient(135deg,#ffd6e7,#f6e6ff,#fff0f5);
 overflow:hidden;
 transition:1s;
}

/* container */
.container{
 background:rgba(255,255,255,0.8);
 backdrop-filter:blur(10px);
 border-radius:25px;
 padding:35px;
 text-align:center;
 box-shadow:0 15px 40px rgba(0,0,0,.1);
 max-width:520px;
 width:90%;
}

/* heading */
h1{
 font-family:'Great Vibes',cursive;
 color:#d63384;
 font-size:42px;
 margin-bottom:15px;
}

/* proposal image */
.proposal-img{
 width:100%;
 max-width:320px;
 border-radius:20px;
 box-shadow:0 10px 30px rgba(0,0,0,0.15);
 margin-bottom:20px;
}

/* text */
.question{
 font-size:20px;
 color:#7b2cbf;
 margin-bottom:20px;
}

/* buttons */
button{
 padding:12px 28px;
 border:none;
 border-radius:40px;
 font-size:16px;
 cursor:pointer;
 margin:10px;
 transition:.3s;
}

#yes{
 background:#ff4da6;
 color:white;
 box-shadow:0 8px 20px rgba(255,77,166,.4);
}

#no{
 background:#999;
 color:white;
 position:absolute;
}

/* message */
#message{
 display:none;
 margin-top:20px;
 font-size:22px;
 color:#ff1493;
 font-weight:600;
 animation:fade 1s ease;
}

@keyframes fade{
 from{opacity:0; transform:scale(.8)}
 to{opacity:1; transform:scale(1)}
}

/* flowers */
.flower{
 position:absolute;
 font-size:24px;
 animation:fall linear infinite;
}

@keyframes fall{
 from{transform:translateY(-10vh)}
 to{transform:translateY(110vh)}
}

/* pink hearts background */
.heart{
 position:absolute;
 width:18px;
 height:18px;
 background:#ff4da6;
 transform:rotate(45deg);
 animation:float 6s infinite;
}
.heart:before,.heart:after{
 content:"";
 position:absolute;
 width:18px;
 height:18px;
 background:#ff4da6;
 border-radius:50%;
}
.heart:before{top:-9px;}
.heart:after{left:-9px;}

@keyframes float{
 from{transform:translateY(100vh) rotate(45deg)}
 to{transform:translateY(-10vh) rotate(45deg)}
}

</style>
</head>

<body>

<div class="container">

<h1>Mistuuu 💖</h1>

<!-- IMAGE FIRST PAGE -->
<img src="proposal.jpg" class="proposal-img">

<div class="question">
Will you be my Valentine forever?
</div>

<button id="yes">Yes ❤️</button>
<button id="no">No</button>

<div id="message">
I love you Mistuuu 💗  
I will always be yours my cuteee valentine.
</div>

</div>

<script>

/* runaway NO button */
let no=document.getElementById("no");
no.onmouseover=no.onclick=function(){
 no.style.left=Math.random()*250+"px";
 no.style.top=Math.random()*120+"px";
}

/* YES click effects */
let yes=document.getElementById("yes");

yes.onclick=function(){

 /* show message */
 document.getElementById("message").style.display="block";

 /* change background pink hearts */
 document.body.style.background="linear-gradient(135deg,#ffc0cb,#ffb6c1,#ff69b4)";
 createHearts();

 /* flower shower */
 flowerShower();
}

/* flowers falling */
function flowerShower(){
 for(let i=0;i<40;i++){
  let flower=document.createElement("div");
  flower.className="flower";
  flower.innerHTML="🌸";
  flower.style.left=Math.random()*100+"vw";
  flower.style.animationDuration=(Math.random()*3+3)+"s";
  document.body.appendChild(flower);
 }
}

/* floating hearts */
function createHearts(){
 for(let i=0;i<25;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(Math.random()*4+4)+"s";
  document.body.appendChild(h);
 }
}

</script>

</body>
</html>
