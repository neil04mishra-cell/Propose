<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Mistuuu 💖</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e7, #f6e6ff, #fff0f5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* Floating hearts background */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      transform: rotate(45deg);
      animation: float 8s infinite;
      opacity: 0.6;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: pink;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); }
      100% { transform: translateY(-10vh) rotate(45deg); }
    }

    .container {
      background: rgba(255,255,255,0.7);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #d63384;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .proposal-img {
      font-size: 70px;
      margin-bottom: 20px;
      transition: 0.4s;
    }

    .buttons {
      margin-top: 20px;
      position: relative;
      height: 120px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
    }

    #yesBtn {
      background: #ff4da6;
      color: white;
      box-shadow: 0 5px 15px rgba(255,77,166,0.4);
    }

    #noBtn {
      background: #aaa;
      color: white;
      position: absolute;
    }

    #loveMessage {
      margin-top: 20px;
      font-size: 18px;
      color: #8a2be2;
      display: none;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8);}
      to { opacity: 1; transform: scale(1);}
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    @media(max-width:600px){
      h1{font-size:1.6rem}
    }
  </style>
</head>

<body>

  <!-- Floating Hearts -->
  <script>
    for(let i=0;i<25;i++){
      let heart=document.createElement("div");
      heart.className="heart";
      heart.style.left=Math.random()*100+"vw";
      heart.style.animationDuration=(Math.random()*5+5)+"s";
      document.body.appendChild(heart);
    }
  </script>

  <div class="container">
    <div class="proposal-img" id="couple">🧎‍♂️💍👩</div>

    <h1>Will you be my Valentine forever, Mistuuu? 💖</h1>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 😢</button>
    </div>

    <div id="loveMessage">
      You make my world brighter every single day, Mistuuu.  
      I love you more than words can ever express. 💗
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti"></canvas>

  <!-- Romantic Music -->
  <audio id="music" loop>
    <source src="romantic.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const message = document.getElementById('loveMessage');
    const couple = document.getElementById('couple');
    const music = document.getElementById('music');

    // Runaway NO button
    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);

    function moveNoButton(){
      const x = Math.random()*250;
      const y = Math.random()*80;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "scale(0.9)";
    }

    // YES button click
    yesBtn.addEventListener('click', () => {
      message.style.display = "block";
      couple.innerHTML = "💑💖";
      music.play();
      startConfetti();
    });

    // Confetti animation
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let pieces = [];

    function startConfetti(){
      for(let i=0;i<200;i++){
        pieces.push({
          x: Math.random()*canvas.width,
          y: Math.random()*canvas.height,
          size: Math.random()*8+4,
          speedY: Math.random()*3+2,
          speedX: Math.random()*2-1,
          color: `hsl(${Math.random()*360},100%,70%)`
        });
      }
      animateConfetti();
    }

    function animateConfetti(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p=>{
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,p.size,p.size);
        p.y+=p.speedY;
        p.x+=p.speedX;
        if(p.y>canvas.height) p.y=0;
      });
      requestAnimationFrame(animateConfetti);
    }
  </script>

</body>
</html>
